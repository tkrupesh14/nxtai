# Local Supabase for the signed-in browser tests (CI runs `supabase start`; see .github/workflows/ci.yml).
# Production is the hosted project; migrations there are still applied by hand.
project_id = "krpex-e2e"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = ["http://127.0.0.1:3100/**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# Tests sign up and are signed in straight away (production has confirmations on).
enable_confirmations = false

# Not needed by the tests: keep the stack small.
[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
