name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Type check, tests, build, smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Public values (they ship in the site's JavaScript). Only the anon key: no server secrets in CI.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://dkdkokkzbptjbgjyjkpz.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrZGtva2t6YnB0amJnanlqa3B6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk2ODAwNTUsImV4cCI6MjA3NTI1NjA1NX0.uX9rh96HlV2_C5rSBsJHa0bxGlluShF4nKK2NeDvmtE' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck
      - name: Unit + database tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke tests (production build)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  signed-in:
    name: Signed-in browser tests (local Supabase + fake AI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Test-only values: a local database seeded with this key (supabase/seed.sql) and a fake AI server.
      SERVER_RPC_KEY: e2e-server-key
      OPENROUTER_API_KEY: fake
      AI_BASE_URL: http://127.0.0.1:3199/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1 # pinned: v3.0.0 (2026-11-02) broke "supabase start"; upgrade deliberately
      - name: Start local Supabase (all migrations + seed)
        run: |
          # Image pulls occasionally fail; try once more before giving up.
          supabase start || { supabase stop --no-backup || true; sleep 10; supabase start; }
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}" >> "$GITHUB_ENV"

      - name: Build against the local database
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Signed-in tests
        run: pnpm test:e2e:signed-in
      - name: Page snapshots from failed tests (shown as annotations)
        if: failure()
        run: |
          find test-results -name error-context.md | head -3 | while read -r f; do
            body=$(head -c 6000 "$f" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Page at failure ($f)::$body"
          done
          if [ -f e2e-server.log ]; then
            body=$(grep -iE "error|fail|warn" e2e-server.log | tail -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=App server errors::${body:-none}"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-signed-in
          path: |
            playwright-report/
            test-results/
          retention-days: 7
